name: check-x-pack-metricbeat

on:
  pull_request:
    paths:
      - '.github/workflows/check-xpack-metricbeat.yml'
      - 'x-pack/metricbeat/**'
      - 'metricbeat/**'

env:
  BEAT_MODULE: 'x-pack/metricbeat'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version-file: .go-version
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Run x-pack workload dependency checks
      run: |
        go mod verify
        go install github.com/magefile/mage@v1.13.0
        GOFLAGS=-mod=readonly mage -d ${{ env.BEAT_MODULE }} -l
