name: check-default

on:
  pull_request:
  push:
    branches:
      - main
      - 7.1*
      - 8.*

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version-file: .go-version
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Run workload checks
      run: |
        go mod verify
        go test ./metricbeat/module/kubernetes/util -run 'TestExtractWorkloadName' -count=1
        go test ./metricbeat/helper/prometheus -run 'TestProcessMetricsSkipsUnmappedFamilies' -count=1
        go build ./metricbeat/module/system/process
