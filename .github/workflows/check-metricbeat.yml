name: check-metricbeat

on:
  pull_request:
    paths:
      - '.github/workflows/check-metricbeat.yml'
      - 'metricbeat/**'
      - 'x-pack/metricbeat/**'

env:
  BEAT_MODULE: 'metricbeat'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version-file: .go-version
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Run metricbeat workload checks
      run: |
        go mod verify
        go test ./metricbeat/module/kubernetes/util -run 'TestExtractWorkloadName' -count=1
        go test ./metricbeat/helper/prometheus -run 'TestProcessMetricsSkipsUnmappedFamilies' -count=1
        go build ./metricbeat/module/system/process
